name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Debug Keystore for Automated Updates
      run: |
        mkdir -p ~/.android
        if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          echo "Keystore successfully decoded from base64."
        else
          echo "Warning: secrets.DEBUG_KEYSTORE_BASE64 is empty. Compilation will fallback to standard gradle debug key."
        fi

    - name: Add Android platform
      run: |
        npx cap add android
        npx cap sync

    - name: Inject Android Permissions
      run: |
        node -e '
          const fs = require("fs");
          const file = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, "utf8");
            const permissions = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />",
              "<uses-permission android:name=\"android.permission.CAMERA\" />",
              "<uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />",
              "<uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
              "<uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />",
              "<uses-feature android:name=\"android.hardware.camera.front\" android:required=\"false\" />",
              "<uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />"
            ].join("\n    ");
            if (!content.includes("android.permission.CAMERA")) {
              content = content.replace("<application", permissions + "\n\n    <application");
              fs.writeFileSync(file, content, "utf8");
              console.log("Permissions successfully injected into AndroidManifest.xml");
            }
          }
        '

    - name: Instalar @capacitor/assets
      run: npm install @capacitor/assets --save-dev

    - name: Gerar ícones e splash screen
      run: npx capacitor-assets generate --android

    - name: Sincronizar Capacitor novamente
      run: npx cap sync android

    - name: Force signingConfig to Use Fixed Keystore
      run: |
        if [ -f ~/.android/debug.keystore ]; then
          if grep -q "android.signingConfigs.debug.storeFile" android/app/build.gradle; then
            echo "signingConfig already configured in build.gradle"
          else
            cat >> android/app/build.gradle << 'EOF'

            android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
            android.signingConfigs.debug.storePassword = "android"
            android.signingConfigs.debug.keyAlias = "androiddebugkey"
            android.signingConfigs.debug.keyPassword = "android"
            android.buildTypes.debug.signingConfig = android.signingConfigs.debug
            EOF
            echo "signingConfig forced to use ~/.android/debug.keystore successfully."
          fi
        else
          echo "Fixed keystore not present, using default gradle debug signature."
        fi

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
