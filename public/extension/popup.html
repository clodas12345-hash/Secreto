<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GKD Secreto - Extensão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .host-pill {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .list {
      display: flex;
      flex-col: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .card-user {
      font-weight: 700;
      font-size: 12px;
      color: #fafafa;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .card-url {
      font-size: 10px;
      color: #71717a;
    }
    .btn-fill {
      background: #2563eb;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-fill:hover { background: #1d4ed8; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      border-top: 1px solid #27272a;
      padding-top: 10px;
    }
    .btn-action {
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #3f3f46;
      color: white;
    }
    .empty-state {
      text-align: center;
      font-size: 11px;
      color: #71717a;
      padding: 15px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="#3b82f6" stroke-width="2.5" fill="none">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      GKD Secreto
    </div>
    <span style="font-size: 10px; color: #10b981; font-weight: 700;">● Ativo</span>
  </div>

  <div class="host-pill">
    <span>Site atual: <b id="current-host" style="color:#e4e4e7;">Detectando...</b></span>
  </div>

  <div class="list" id="credentials-list">
    <div class="empty-state">Buscando senhas salvas...</div>
  </div>

  <div class="actions">
    <button class="btn-action" id="btn-generate">⚡ Gerar Senha</button>
    <button class="btn-action" id="btn-open-vault">🔒 Abrir Cofre</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
