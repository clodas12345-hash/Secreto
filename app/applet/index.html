<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secreto - Cofre de Senhas</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app-container">
    <!-- Tela do Cofre de Senhas (Painel Principal - Acesso Público Direto) -->
    <div id="vault-screen" class="screen active">
      <header class="vault-header">
        <div class="header-title">
          <div class="title-left">
            <i class="fa-solid fa-vault"></i>
            <h2>Secreto</h2>
          </div>
          <div class="header-badge">Acesso Público</div>
        </div>
        <div class="header-subtitle">Cofre Local • Sem Autenticação</div>
      </header>

      <div class="vault-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Buscar credenciais...">
        </div>
        <button id="open-add-modal" class="btn-accent">
          <i class="fa-solid fa-plus"></i> Nova Senha
        </button>
      </div>

      <div id="vault-list" class="vault-list"></div>
    </div>

    <!-- Modal Adicionar/Editar Credencial -->
    <div id="modal-add" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">Nova Credencial</h3>
          <button id="close-modal" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="add-credential-form">
          <input type="hidden" id="item-id">
          <div class="input-group">
            <label>Título / Serviço</label>
            <input type="text" id="service-title" placeholder="Ex: Banco, Gmail, Instagram" required>
          </div>
          <div class="input-group">
            <label>Usuário / E-mail</label>
            <input type="text" id="service-user" placeholder="usuario@email.com" required>
          </div>
          <div class="input-group">
            <label>Senha</label>
            <div class="password-row">
              <input type="text" id="service-pass" placeholder="Senha" required>
              <button type="button" id="generate-pass" class="btn-small" title="Gerar Senha Forte">Gerar</button>
            </div>
          </div>
          <button type="submit" class="btn-primary">Salvar Credencial</button>
        </form>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
